name: Android emulator smoke test
on:
  workflow_dispatch:
  push:
    branches: [android-mvp]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/android-emulator-test.yml"

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Install and launch on Android emulator
        id: emulator-test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -Eeuo pipefail
            mkdir -p test-results
            adb devices -l | tee test-results/adb-devices.txt
            echo "Waiting for Android boot completion (maximum 8 minutes)..."
            timeout 480s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
            adb shell getprop ro.build.version.release | tee test-results/android-version.txt
            adb shell getprop sys.boot_completed | tee test-results/boot-completed.txt

            echo "Installing APK..."
            timeout 180s adb install -r app/build/outputs/apk/debug/app-debug.apk | tee test-results/install.txt

            echo "Launching FileLens..."
            adb shell am force-stop com.filelens.android
            adb shell am start -W -n com.filelens.android/.MainActivity | tee test-results/launch.txt
            sleep 10

            echo "Checking application process..."
            adb shell pidof com.filelens.android | tee test-results/process.txt

            echo "Checking visible UI..."
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml test-results/window.xml
            grep -q 'FileLens' test-results/window.xml
            grep -q 'Dodaj i indeksuj PDF' test-results/window.xml
            adb shell screencap -p /sdcard/filelens-screen.png
            adb pull /sdcard/filelens-screen.png test-results/screenshot.png
            adb logcat -d -v threadtime > test-results/logcat.txt
            echo "SMOKE TEST PASSED"

      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p test-results
          adb devices -l > test-results/adb-devices-after.txt 2>&1 || true
          adb logcat -d -v threadtime > test-results/logcat-after.txt 2>&1 || true
          adb shell getprop > test-results/system-properties.txt 2>&1 || true
          adb shell dumpsys activity activities > test-results/activities-after.txt 2>&1 || true

      - name: Upload APK and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileLens-Android-test-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            test-results/
          if-no-files-found: warn
          retention-days: 14
