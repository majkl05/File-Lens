name: Android emulator smoke test
on:
  workflow_dispatch:
  push:
    branches: [android-mvp]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/android-emulator-test.yml"

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Install and launch on Android emulator
        id: emulator-test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -Eeuo pipefail
            mkdir -p test-results
            adb devices -l | tee test-results/adb-devices.txt
            echo "Waiting for Android boot completion (maximum 8 minutes)..."
            timeout 480s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
            adb shell getprop ro.build.version.release | tee test-results/android-version.txt
            adb shell getprop sys.boot_completed | tee test-results/boot-completed.txt

            echo "Installing APK..."
            timeout 180s adb install -r app/build/outputs/apk/debug/app-debug.apk | tee test-results/install.txt

            echo "Launching FileLens..."
            adb shell am force-stop com.filelens.android
            adb shell am start -W -n com.filelens.android/.MainActivity | tee test-results/launch.txt
            sleep 10

            echo "Checking application process..."
            adb shell pidof com.filelens.android | tee test-results/process.txt

            echo "Checking visible UI..."
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml test-results/window.xml
            grep -q 'FileLens' test-results/window.xml
            grep -q 'Dodaj i indeksuj PDF' test-results/window.xml
            adb shell screencap -p /sdcard/filelens-screen.png
            adb pull /sdcard/filelens-screen.png test-results/screenshot.png
            adb logcat -d -v threadtime > test-results/logcat.txt
            echo "SMOKE TEST PASSED"

      - name: Collect emulator diagnostics
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          printf 'Diagnostics started at %s\n' "$(date -Is)" > test-results/diagnostics-status.txt
          printf 'Runner: %s\n' "$RUNNER_NAME" >> test-results/diagnostics-status.txt
          printf '\nADB client version:\n' >> test-results/diagnostics-status.txt
          adb version >> test-results/diagnostics-status.txt 2>&1
          printf '\nADB processes before collection:\n' >> test-results/diagnostics-status.txt
          ps aux | grep '[a]db' >> test-results/diagnostics-status.txt 2>&1

          collect() {
            name="$1"
            shift
            echo "Collecting $name (20-second limit)..."
            timeout --signal=TERM --kill-after=5s 20s "$@" > "test-results/$name" 2>&1
            rc=$?
            echo "$name exit code: $rc" >> test-results/diagnostics-status.txt
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "$name timed out" >> test-results/diagnostics-status.txt
            fi
            return 0
          }

          collect adb-devices-after.txt adb devices -l
          collect logcat-after.txt adb logcat -d -v threadtime
          collect system-properties.txt adb shell getprop
          collect activities-after.txt adb shell dumpsys activity activities
          printf '\nDiagnostics finished at %s\n' "$(date -Is)" >> test-results/diagnostics-status.txt

      - name: Upload APK and test diagnostics
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: FileLens-Android-test-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            test-results/
          if-no-files-found: warn
          retention-days: 14
